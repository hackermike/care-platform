name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main. A stacked PR (one branch
  # based on another) targets its parent branch, and filtering on base meant
  # those ran no checks at all.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
