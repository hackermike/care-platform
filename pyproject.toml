[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic autogenerates these with its own conventions (Union types, import order).
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
