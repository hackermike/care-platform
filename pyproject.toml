[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic autogenerates these with its own conventions (Union types, import order).
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)`/`Form(...)` in argument defaults is FastAPI's declaration
# syntax, not the mutable-default bug B008 exists to catch.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Form",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Header",
  "fastapi.Cookie",
  "fastapi.Body",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
