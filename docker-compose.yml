services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: care
      POSTGRES_PASSWORD: care
      POSTGRES_DB: care
    ports:
      - "5432:5432"
    volumes:
      - care_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U care"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  care_pgdata:
